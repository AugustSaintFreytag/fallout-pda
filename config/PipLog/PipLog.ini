[Reminders]
bPlayerDateReminders = 1				; Displays one-shot reminder messages for future dates the player has manually tracked.
bSystemEventReminders = 1				; Displays a wake-up message for built-in system events on the current day, including holidays and computed events.
bPlayerEventReminders = 1				; Displays a wake-up message for player-created events on the current day.
iDailyEventReminderDuration = 6			; Seconds to display an event reminder message.
fDailyEventReminderDelay = 1.0			; Seconds to wait after returning to gameplay before showing the daily event message.

[Events] 								; Computed events may be toggled here.
bThanksgiving = 1						; Thanksgiving takes place always takes place on the 4th Thursday of November.
bEaster=1								; Easter falls on the first Sunday after the first full moon that occurs on or after the vernal equinox.